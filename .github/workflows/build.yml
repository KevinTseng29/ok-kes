name: 实验版打包发布

on:
  push:
    tags:
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      version:
        description: 已存在的实验版本标签，例如 v1.4.10-alpha.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: experimental-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: 确认版本标签
        shell: pwsh
        run: |
          $version = '${{ inputs.version || github.ref_name }}'
          if ($version -notmatch '^v\d+\.\d+\.\d+-alpha\.\d+$') { throw '实验版必须使用 alpha 标签' }
          git rev-parse --verify "refs/tags/$version"
          if ($LASTEXITCODE -ne 0) { throw '版本标签不存在' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: 安装打包依赖
        run: python -m pip install -r requirements-build.txt
      - name: 运行功能测试
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 打包单文件 exe
        run: python scripts/build_portable.py --version $env:RELEASE_VERSION
      - name: 验证冻结程序与 OCR 模型
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/ok-kes-experimental-win64-*.exe | Select-Object -First 1).FullName
          $report = Join-Path $env:GITHUB_WORKSPACE 'build/portable-self-test.json'
          $env:__COMPAT_LAYER = 'RunAsInvoker'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--self-test-report', "`"$report`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw '冻结程序自检失败' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw '冻结程序自检未通过' }
          Get-Content $report
      - name: 保存构建诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-build-diagnostics
          path: |
            build/portable-self-test.json
            build/spec/*.spec
            build/**/warn-*.txt
          if-no-files-found: ignore
      - name: 发布实验 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ok-kes 实验版 ${{ env.RELEASE_VERSION }}
          prerelease: true
          make_latest: false
          body_path: docs/releases/experimental.md
          fail_on_unmatched_files: true
          files: |
            dist/ok-kes-experimental-win64-*.exe
            dist/SHA256SUMS.txt
